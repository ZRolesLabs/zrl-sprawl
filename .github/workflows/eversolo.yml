name: Eversolo
# Builds the Eversolo screensaver app (eversolo/) from source on every push and pull request that touches it.
# The app is kept as a workflow artifact and on the eversolo-builds branch as zrl-sprawl-eversolo-base.apk
# (no film inside, debug-signed). The film is added and the APK signed with the ZRolesLabs key by
# eversolo/film/pack_film.py.
#
# Running this workflow by hand with "release" ticked publishes the signed APK as a GitHub Release
# (tag eversolo-v<eversolo/VERSION>). It takes the APK from the eversolo-drop branch, where it sits in
# parts (GitHub refuses single files over 100 MB), and refuses to publish unless its SHA-256 matches
# eversolo/RELEASE-SHA256 in this commit. The release is never marked "latest", so the Windows download
# link (releases/latest/download/ZRL-Sprawl.zip) keeps pointing at the Windows build.
# Once a version is published and eversolo-drop is deleted, a release run only refreshes its notes.
on:
  push:
    paths: ['eversolo/**', '.github/workflows/eversolo.yml']
  pull_request:
    paths: ['eversolo/**', '.github/workflows/eversolo.yml']
  workflow_dispatch:
    inputs:
      release:
        description: Publish the Eversolo release (tag eversolo-v<eversolo/VERSION>)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build the app (no film)
        env:
          ZS_BUILD_NUMBER: ${{ github.run_number }}
        run: gradle -p eversolo assembleRelease --no-daemon --stacktrace
      - run: cp eversolo/app/build/outputs/apk/release/app-release.apk zrl-sprawl-eversolo-base.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zrl-sprawl-eversolo-base
          path: zrl-sprawl-eversolo-base.apk
      - name: Keep the latest build on the eversolo-builds branch
        if: github.event_name != 'pull_request'
        run: |
          mkdir out && cp zrl-sprawl-eversolo-base.apk out/ && cd out
          echo "${{ github.sha }} · run ${{ github.run_number }} · ${{ github.ref_name }}" > BUILD.txt
          git init -q -b eversolo-builds && git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Eversolo base build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" eversolo-builds

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release == true
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the signed APK and check it (first publish only)
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(tr -d ' \r\n' < eversolo/VERSION); TAG="eversolo-v$v"
          if gh release view "$TAG" >/dev/null 2>&1 && ! git ls-remote --exit-code origin refs/heads/eversolo-drop >/dev/null; then
            echo "$TAG is already published and eversolo-drop is gone: refreshing the release notes only."
            echo "notes_only=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch -q --depth 1 origin eversolo-drop
          git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP"
          cat "$RUNNER_TEMP"/zrl-sprawl-eversolo.apk.part-* > zrl-sprawl-eversolo.apk
          want=$(tr -d ' \r\n' < eversolo/RELEASE-SHA256)
          got=$(sha256sum zrl-sprawl-eversolo.apk | cut -d' ' -f1)
          echo "want $want"; echo "got  $got"
          [ "$want" = "$got" ] || { echo "::error::APK checksum does not match eversolo/RELEASE-SHA256"; exit 1; }
      - name: Publish the release (not marked latest)
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_ONLY: ${{ steps.apk.outputs.notes_only }}
        run: |
          v=$(tr -d ' \r\n' < eversolo/VERSION); TAG="eversolo-v$v"
          sum=$(tr -d ' \r\n' < eversolo/RELEASE-SHA256)
          { cat docs/eversolo-release-notes.md; printf '\n\nSHA-256 of `zrl-sprawl-eversolo.apk`: `%s`\n' "$sum"; } > "$RUNNER_TEMP/notes.md"
          if [ "$NOTES_ONLY" = "true" ]; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest=false
          elif gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" zrl-sprawl-eversolo.apk --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest=false
          else
            gh release create "$TAG" zrl-sprawl-eversolo.apk --target "$GITHUB_SHA" --title "ZRL Sprawl for Eversolo v$v" --notes-file "$RUNNER_TEMP/notes.md" --latest=false
          fi
